# Chạy Postgres cho môi trường dev: docker compose up -d
# Cổng ngoài đặt là 5433 (không phải 5432 mặc định) để KHÔNG xung đột với
# một PostgreSQL cài sẵn (native) có thể đang chạy sẵn trên máy Windows.
services:
  db:
    image: postgres:16-alpine
    container_name: learnquiz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnquiz_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learnquiz_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: learnquiz_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
