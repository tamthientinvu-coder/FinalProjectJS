server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router dùng history API: mọi đường dẫn không phải file tĩnh
    # đều phải trả về index.html, nếu không F5 ở /courses/5 sẽ ra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tài nguyên có hash trong tên nên cache dài ngày được
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
