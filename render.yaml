# Bản thiết kế hạ tầng cho Render (Blueprint).
# Vào Render -> New -> Blueprint -> trỏ vào repository này là dựng đủ
# cơ sở dữ liệu và API, không phải bấm tay từng bước.
databases:
  - name: learnquiz-db
    databaseName: learnquiz_db
    user: learnquiz
    plan: free
    region: singapore

services:
  - type: web
    name: learnquiz-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # migrate deploy nằm ở BUILD: chạy một lần mỗi lần deploy,
    # thay vì chạy lại ở mỗi lần container khởi động lại.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: learnquiz-db
          property: connectionString
      # sync: false = Render tự sinh chuỗi ngẫu nhiên, không lưu trong git
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      # Điền URL Vercel thật sau khi deploy frontend
      - key: FE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
